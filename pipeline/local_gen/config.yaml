# Local Generation Pipeline Configuration
# ========================================
# Edit this file to tune the pipeline for your hardware and goals.

# ── Model ────────────────────────────────────────────────────────────────────
model: "qwen2.5-coder:7b-instruct-q4_K_M"
# Alternatives (if above fails to pull):
#   qwen2.5-coder:7b-instruct   (auto-picks quantization)
#   deepseek-coder-v2:lite      (MoE, faster, lower VRAM)
#   qwen2.5-coder:3b-instruct   (smallest, fast but lower quality)

# ── Ollama server ────────────────────────────────────────────────────────────
ollama_url: "http://localhost:11434"
ollama_timeout: 120   # seconds per request

# ── Generation parameters ────────────────────────────────────────────────────
temperature: 0.7        # 0.6–0.8 for code (lower = more deterministic)
top_p: 0.9
max_tokens: 2048        # Max tokens to generate per sample
num_ctx: 4096           # Context window (reduce to 2048 if OOM errors)

# ── Pipeline ─────────────────────────────────────────────────────────────────
few_shot_count: 3                        # How many examples to inject per prompt
min_length: 1500                         # Minimum chars in generated content
max_repair_attempts: 2                   # Retry with repair this many times
skip_domains_in_corpus: true             # Skip domains already well-covered
output_dir: "data/local_raw"             # Where to save generated files
train_data: "data/master/train.jsonl"    # Source of few-shot examples

# ── Run limits ────────────────────────────────────────────────────────────────
max_per_run: 200        # Max samples per run (0 = unlimited)
delay_between: 1.0      # Seconds between requests (prevents GPU thermal throttle)

# ── Logging ──────────────────────────────────────────────────────────────────
log_file: "pipeline/local_gen/generation.log"
show_progress: true
